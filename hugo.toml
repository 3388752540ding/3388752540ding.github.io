baseURL = "https://3388752540ding.github.io/"
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-CN'
theme = 'reimu'

# 代码高亮配置（文档要求）
[markup.highlight]
  guessSyntax = true
  noClasses = false

# 允许 Markdown 渲染原生 HTML（解决你之前的第二个警告）
[markup.goldmark.renderer]
  unsafe = true

# 中文支持
[languages]
  [languages.zh-CN]
    languageName = '简体中文'
    weight = 1
    hasCJKLanguage = true